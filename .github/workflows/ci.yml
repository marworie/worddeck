# Her push ve pull request'te backend testleri ve frontend derlemesi çalışır.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Test projesi backend'i referans aldığı için ikisi birlikte derlenir
      - name: Restore
        run: dotnet restore WordDeck.Tests/WordDeck.Tests.csproj

      - name: Build
        run: dotnet build WordDeck.Tests/WordDeck.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test WordDeck.Tests/WordDeck.Tests.csproj --no-build -c Release --verbosity normal

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build